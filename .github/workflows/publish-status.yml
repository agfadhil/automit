name: Publish Automation Status

on:
  workflow_run:
    workflows: ['Daily Auto Commit']
    types: [completed]
  push:
    paths:
      - index.html
      - assets/**
      - data/status.json
      - scripts/build-status.mjs
      - .github/workflows/publish-status.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automit-pages
  cancel-in-progress: false

jobs:
  build:
    name: Perbarui status
    if: >-
      (github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      pages: read
    steps:
      # Never execute code or download artifacts from the triggering workflow.
      # Only the trusted repository default branch is checked out.
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Siapkan Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Ambil status dan siapkan halaman
        run: node scripts/build-status.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_ERROR_DETAILS: ${{ vars.PUBLISH_ERROR_DETAILS }}
      - name: Konfigurasi GitHub Pages
        uses: actions/configure-pages@v5
      - name: Unggah halaman status
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publikasikan halaman
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
